<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variedades Juancho La Octava</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7f6;
  color:#173b42;
}

header{
  background:linear-gradient(135deg,#073f48,#087b72);
  color:white;
  padding:20px;
  text-align:center;
}

.logo{
  max-width:180px;
  max-height:90px;
  object-fit:contain;
  margin-bottom:10px;
}

header h1{
  margin:5px 0;
  font-size:26px;
}

header p{
  margin:5px 0;
  opacity:.9;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.search{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-bottom:20px;
  outline:none;
}

.search:focus{
  border-color:#087b72;
}

.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

select{
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  background:white;
  font-size:15px;
}

.estado{
  text-align:center;
  padding:30px 10px;
  font-size:18px;
}

.error{
  background:#ffe8e8;
  color:#9b1c1c;
  padding:18px;
  border-radius:10px;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 7px 20px rgba(0,0,0,.14);
}

.imagen{
  height:220px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.imagen img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.sin-imagen{
  color:#999;
  text-align:center;
}

.info{
  padding:16px;
}

.marca{
  font-size:13px;
  color:#087b72;
  font-weight:bold;
  text-transform:uppercase;
}

.nombre{
  font-size:17px;
  font-weight:bold;
  margin:7px 0;
  line-height:1.25;
}

.ref{
  font-size:13px;
  color:#777;
  margin-bottom:10px;
}

.precio{
  font-size:20px;
  font-weight:bold;
  color:#073f48;
}

.oferta{
  color:#e65100;
  font-size:20px;
  font-weight:bold;
}

.badges{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin-top:10px;
}

.badge{
  background:#e8f5f2;
  color:#087b72;
  padding:5px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

footer{
  margin-top:40px;
  background:#073f48;
  color:white;
  text-align:center;
  padding:25px;
}

@media(max-width:600px){
  header h1{
    font-size:21px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .imagen{
    height:170px;
  }

  .info{
    padding:12px;
  }

  .nombre{
    font-size:15px;
  }

  .precio,
  .oferta{
    font-size:17px;
  }
}
</style>
</head>

<body>

<header>

  <img
    src="logo.png"
    class="logo"
    alt="Variedades Juancho La Octava"
    onerror="this.style.display='none'"
  >

  <h1>Variedades Juancho La Octava</h1>
  <p>Electrodomésticos y Cristalería</p>

</header>

<div class="container">

  <input
    type="search"
    id="busqueda"
    class="search"
    placeholder="Buscar producto, marca o referencia..."
  >

  <div class="filters">

    <select id="categoria">
      <option value="">Todas las categorías</option>
    </select>

    <select id="marca">
      <option value="">Todas las marcas</option>
    </select>

  </div>

  <div id="estado" class="estado">
    Cargando productos...
  </div>

  <div id="productos" class="grid"></div>

</div>

<footer>
  <strong>Variedades Juancho La Octava</strong>
  <br>
  Electrodomésticos y Cristalería
  <br><br>
  📍 La Hormiga, Putumayo
  <br>
  📲 321 975 5256
</footer>


<script>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vScjVb-MSKc0GOTMvpaXGqaYoqmWKb2YejFsWUauA4dRNZuBQzOH4y8thksz6KVw405F2au7pYKCHP_/pub?output=csv";


/* =====================================================
   VARIABLES
===================================================== */

let productos = [];

const contenedor = document.getElementById("productos");
const estado = document.getElementById("estado");
const busqueda = document.getElementById("busqueda");
const categoria = document.getElementById("categoria");
const marca = document.getElementById("marca");


/* =====================================================
   LIMPIAR NOMBRES DE COLUMNAS
===================================================== */

function limpiar(texto){

  return String(texto || "")
    .replace(/^\uFEFF/, "")
    .trim()
    .toUpperCase();

}


/* =====================================================
   PARSER CSV
===================================================== */

function parseCSV(texto){

  const filas = [];
  let fila = [];
  let campo = "";
  let comillas = false;

  for(let i=0;i<texto.length;i++){

    const c = texto[i];
    const siguiente = texto[i+1];

    if(c === '"' && comillas && siguiente === '"'){
      campo += '"';
      i++;
      continue;
    }

    if(c === '"'){
      comillas = !comillas;
      continue;
    }

    if(c === "," && !comillas){

      fila.push(campo);
      campo = "";
      continue;

    }

    if((c === "\n" || c === "\r") && !comillas){

      if(c === "\r" && siguiente === "\n") i++;

      fila.push(campo);
      campo = "";

      if(fila.some(x => String(x).trim() !== "")){
        filas.push(fila);
      }

      fila = [];
      continue;

    }

    campo += c;

  }

  if(campo !== "" || fila.length){

    fila.push(campo);

    if(fila.some(x => String(x).trim() !== "")){
      filas.push(fila);
    }

  }

  return filas;

}


/* =====================================================
   CARGAR CSV
===================================================== */

async function cargarProductos(){

  try{

    estado.style.display = "block";
    estado.textContent = "Cargando productos...";

    const respuesta = await fetch(CSV_URL + "&t=" + Date.now());

    if(!respuesta.ok){
      throw new Error("No se pudo acceder al CSV");
    }

    const texto = await respuesta.text();

    if(!texto || texto.length < 20){
      throw new Error("El CSV está vacío");
    }

    const filas = parseCSV(texto);

    if(filas.length < 2){
      throw new Error("No se encontraron productos");
    }

    const encabezados = filas[0].map(limpiar);

    console.log("ENCABEZADOS ENCONTRADOS:", encabezados);

    productos = filas.slice(1).map((fila, indice) => {

      const producto = {};

      encabezados.forEach((encabezado, posicion) => {

        producto[encabezado] =
          String(fila[posicion] || "").trim();

      });

      /*
        Si no existe ID, utilizamos el número de fila
        como respaldo.
      */

      if(!producto.ID){
        producto.ID = "FILA_" + (indice + 1);
      }

      return producto;

    });

    /*
      Quitamos filas completamente vacías
    */

    productos = productos.filter(p =>
      p.NOMBRE_PRODUCTO ||
      p.REFERENCIA ||
      p.MARCA
    );

    if(productos.length === 0){
      throw new Error("La tabla no contiene productos válidos");
    }

    crearFiltros();
    mostrarProductos();

    estado.style.display = "none";

  }catch(error){

    console.error(error);

    estado.innerHTML = `
      <div class="error">
        <strong>No se pudieron cargar los productos.</strong>
        <br><br>
        ${error.message}
        <br><br>
        Revisa que Google Sheets esté publicado en la web.
      </div>
    `;

  }

}


/* =====================================================
   FILTROS
===================================================== */

function crearFiltros(){

  const categorias = [...new Set(
    productos
      .map(p => p.CATEGORIA)
      .filter(Boolean)
  )].sort();

  const marcas = [...new Set(
    productos
      .map(p => p.MARCA)
      .filter(Boolean)
  )].sort();


  categoria.innerHTML =
    `<option value="">Todas las categorías</option>`;

  marca.innerHTML =
    `<option value="">Todas las marcas</option>`;


  categorias.forEach(valor => {

    categoria.innerHTML += `
      <option value="${escapeHTML(valor)}">
        ${escapeHTML(valor)}
      </option>
    `;

  });


  marcas.forEach(valor => {

    marca.innerHTML += `
      <option value="${escapeHTML(valor)}">
        ${escapeHTML(valor)}
      </option>
    `;

  });

}


/* =====================================================
   MOSTRAR PRODUCTOS
===================================================== */

function mostrarProductos(){

  const texto = busqueda.value.toLowerCase().trim();
  const cat = categoria.value;
  const mar = marca.value;


  const filtrados = productos.filter(p => {

    const contenido = [

      p.NOMBRE_PRODUCTO,
      p.MARCA,
      p.REFERENCIA,
      p.CATEGORIA,
      p.SUBCATEGORIA,
      p.DESCRIPCION_CORTA

    ].join(" ").toLowerCase();


    const coincideBusqueda =
      !texto || contenido.includes(texto);

    const coincideCategoria =
      !cat || p.CATEGORIA === cat;

    const coincideMarca =
      !mar || p.MARCA === mar;


    return coincideBusqueda &&
           coincideCategoria &&
           coincideMarca;

  });


  if(filtrados.length === 0){

    contenedor.innerHTML = `
      <div class="estado">
        No encontramos productos con esa búsqueda.
      </div>
    `;

    return;

  }


  contenedor.innerHTML =
    filtrados.map(crearTarjeta).join("");

}


/* =====================================================
   CREAR TARJETA
===================================================== */

function crearTarjeta(p){

  const id = encodeURIComponent(p.ID);

  const nombre =
    p.NOMBRE_PRODUCTO ||
    "Producto";

  const imagen =
    obtenerImagen(p.URL_IMAGEN_PRINCIPAL);


  let precio = "";

  if(p.PRECIO){

    precio = `
      <div class="precio">
        ${formatearPrecio(p.PRECIO)}
      </div>
    `;

  }


  let precioOferta = "";

  if(p.PRECIO_OFERTA){

    precioOferta = `
      <div class="oferta">
        ${formatearPrecio(p.PRECIO_OFERTA)}
      </div>
    `;

  }


  return `

    <article
      class="card"
      onclick="abrirProducto('${id}')"
    >

      <div class="imagen">

        ${
          imagen

          ?

          `<img
             src="${escapeHTML(imagen)}"
             alt="${escapeHTML(nombre)}"
             loading="lazy"
             onerror="imagenError(this)"
           >`

          :

          `<div class="sin-imagen">
             Imagen próximamente
           </div>`
        }

      </div>


      <div class="info">

        ${
          p.MARCA
          ?
          `<div class="marca">
             ${escapeHTML(p.MARCA)}
           </div>`
          :
          ""
        }


        <div class="nombre">
          ${escapeHTML(nombre)}
        </div>


        ${
          p.REFERENCIA
          ?
          `<div class="ref">
             Ref: ${escapeHTML(p.REFERENCIA)}
           </div>`
          :
          ""
        }


        ${precio}

        ${precioOferta}



      </div>

    </article>

  `;

}


/* =====================================================
   ABRIR PRODUCTO INDIVIDUAL
===================================================== */

function abrirProducto(id){

  window.location.href =
    "producto.html?id=" + id;

}


/* =====================================================
   IMÁGENES
===================================================== */

function obtenerImagen(url){

  if(!url) return "";

  url = String(url).trim();

  /*
    Google Drive
  */

  let match =
    url.match(/drive\.google\.com\/file\/d\/([^/]+)/);

  if(match){

    return
      "https://drive.google.com/thumbnail?id="
      + match[1]
      + "&sz=w1000";

  }


  match =
    url.match(/[?&]id=([^&]+)/);

  if(
    url.includes("drive.google.com") &&
    match
  ){

    return
      "https://drive.google.com/thumbnail?id="
      + match[1]
      + "&sz=w1000";

  }


  return url;

}


/* =====================================================
   ERROR DE IMAGEN
===================================================== */

function imagenError(img){

  img.style.display = "none";

  if(img.parentElement){

    img.parentElement.innerHTML =
      `<div class="sin-imagen">
         Imagen no disponible
       </div>`;

  }

}


/* =====================================================
   PRECIO
===================================================== */

function formatearPrecio(valor){

  const numero =
    Number(
      String(valor)
        .replace(/\$/g,"")
        .replace(/\./g,"")
        .replace(/,/g,".")
        .trim()
    );

  if(isNaN(numero)){
    return escapeHTML(valor);
  }

  return "$" +
    numero.toLocaleString("es-CO");

}


/* =====================================================
   SEGURIDAD HTML
===================================================== */

function escapeHTML(valor){

  return String(valor || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   EVENTOS
===================================================== */

busqueda.addEventListener(
  "input",
  mostrarProductos
);

categoria.addEventListener(
  "change",
  mostrarProductos
);

marca.addEventListener(
  "change",
  mostrarProductos
);


/* =====================================================
   INICIAR
===================================================== */

cargarProductos();

</script>

</body>
</html>
