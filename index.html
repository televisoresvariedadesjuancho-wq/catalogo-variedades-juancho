function parseCSV(t){let rows=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);if(!rows.length)return[];let h=rows.shift().map(x=>x.trim().toUpperCase());return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])))}
function val(o,ks){for(const k of ks)if(o[k])return o[k];return ''}
function render(items){let q=document.getElementById('search').value.toLowerCase(),b=document.getElementById('brand').value;let a=items.filter(p=>JSON.stringify(p).toLowerCase().includes(q)&&(!b||val(p,['MARCA','BRAND']).toLowerCase()===b.toLowerCase()));document.getElementById('status').style.display=a.length?'none':'block';document.getElementById('grid').innerHTML=a.map(p=>{let name=val(p,['NOMBRE_PRODUCTO','NOMBRE','PRODUCTO','DESCRIPCION','REFERENCIA'])||'Producto',brand=val(p,['MARCA','BRAND']),img=val(p,['P_URL_IMAGEN_PRINCIPAL','URL_IMAGEN_PRINCIPAL','IMAGEN','FOTO','URL']),price=val(p,['PRECIO_OFERTA','PRECIO','PRICE']),specs=[val(p,['CAPACIDAD_L','CAPACIDAD']),val(p,['TIPO']),val(p,['COLOR'])].filter(Boolean).join(' · '),link=WHATSAPP_NUMBER?'https://wa.me/'+WHATSAPP_NUMBER+'?text='+encodeURIComponent('Hola, quiero consultar por: '+name):'#';return '<article class="card"><div class="photo">'+(img?'<img src="'+img+'" loading="lazy" onerror="this.parentElement.innerHTML=\'Imagen no disponible\'">':'Imagen del producto')+'</div><div class="body">'+(brand?'<span class="tag">'+brand+'</span>':'')+'<h3>'+name+'</h3><div class="specs">'+(specs||'Consulta disponibilidad y características')+'</div>'+(price?'<div class="price">$ '+price.replace(/[^0-9.,-]/g,'')+'</div>':'')+'<a class="btn" href="'+link+'" target="_blank">Consultar por WhatsApp</a></div></article>'}).join('')}
async function start(){try{let r=await fetch(CSV_URL,{cache:'no-store'});if(!r.ok)throw Error();let d=parseCSV(await r.text());if(!d.length)throw Error();window.products=d;let brands=[...new Set(d.map(p=>val(p,['MARCA','BRAND'])).filter(Boolean))].sort();document.getElementById('brand').innerHTML='<option value="">Todas las marcas</option>'+brands.map(b=>'<option>'+b+'</option>').join('');render(d)}catch(e){window.products=FALLBACK;render(FALLBACK);document.getElementById('status').style.display='none'}}
document.getElementById('search').addEventListener('input',()=>render(window.products||[]));document.getElementById('brand').addEventListener('change',()=>render(window.products||[]));start();</script></body></html>
