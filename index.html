<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Variedades Juancho La Octava</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header img {
      max-width: 220px;
      max-height: 90px;
      object-fit: contain;
    }

    header h1 {
      margin: 12px 0 5px;
      font-size: 25px;
    }

    header p {
      margin: 0;
      color: #ddd;
    }

    .contenedor {
      width: 94%;
      max-width: 1400px;
      margin: 25px auto;
    }

    .barra {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .barra input,
    .barra select {
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    .barra input {
      flex: 1;
      min-width: 230px;
    }

    .barra select {
      min-width: 180px;
    }

    #estado {
      text-align: center;
      padding: 30px;
      font-size: 18px;
    }

    .productos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 20px;
    }

    .producto {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .producto:hover {
      transform: translateY(-4px);
      box-shadow: 0 7px 18px rgba(0,0,0,0.16);
    }

    .producto-imagen {
      width: 100%;
      height: 230px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .producto-imagen img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .sin-imagen {
      color: #999;
      font-size: 14px;
      text-align: center;
    }

    .producto-info {
      padding: 16px;
    }

    .marca {
      color: #087f8c;
      font-weight: bold;
      font-size: 14px;
      text-transform: uppercase;
    }

    .producto h2 {
      font-size: 17px;
      margin: 7px 0;
      line-height: 1.3;
    }

    .referencia {
      color: #777;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .precio {
      font-size: 21px;
      font-weight: bold;
      color: #111;
    }

    .oferta {
      color: #d71920;
      font-size: 21px;
      font-weight: bold;
    }

    .boton {
      display: block;
      width: 100%;
      margin-top: 13px;
      padding: 11px;
      background: #111;
      color: white;
      border: none;
      border-radius: 7px;
      text-align: center;
      font-weight: bold;
    }

    .mensaje-error {
      background: #fff3f3;
      color: #b00020;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 21px;
      }

      .productos {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .producto-imagen {
        height: 170px;
      }

      .producto-info {
        padding: 11px;
      }

      .producto h2 {
        font-size: 14px;
      }

      .precio,
      .oferta {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

<header>

  <!-- CAMBIA ESTA URL POR LA URL DE TU LOGO -->
  <img
    src="https://televisoresvariedadesjuancho-wq.github.io/catalogo-variedades-juancho/logo.png"
    alt="Variedades Juancho La Octava"
    onerror="this.style.display='none'"
  >

  <h1>VARIEDADES JUANCHO LA OCTAVA</h1>
  <p>Electrodomésticos y Cristalería</p>

</header>

<div class="contenedor">

  <div class="barra">

    <input
      type="text"
      id="buscador"
      placeholder="Buscar producto, marca o referencia..."
    >

    <select id="categoria">
      <option value="">Todas las categorías</option>
    </select>

    <select id="marca">
      <option value="">Todas las marcas</option>
    </select>

  </div>

  <div id="estado">
    Cargando productos...
  </div>

  <div id="productos" class="productos"></div>

</div>

<script>

  /*
  ==========================================================
  URL DE GOOGLE SHEETS
  ==========================================================

  PEGA AQUÍ LA URL CSV PUBLICADA DE TU GOOGLE SHEETS.

  EJEMPLO:

  const CSV_URL =
  "https://docs.google.com/spreadsheets/d/ID_DE_TU_ARCHIVO/export?format=csv&gid=0";

  ==========================================================
  */

  const CSV_URL = "https://docs.google.com/spreadsheets/d/1QcuNsekBBm_qFwUvFL_td8Bsyvqf5lLEFyIRhWdCRbU/edit?usp=sharing";


  // Número de WhatsApp de Variedades Juancho
  const WHATSAPP_NUMBER = "573219755256";


  let productos = [];


  // ==========================================================
  // LEER CSV
  // ==========================================================

  async function cargarProductos() {

    const estado = document.getElementById("estado");

    try {

      if (CSV_URL === "PEGA_AQUI_TU_URL_CSV") {

        estado.innerHTML = `
          <div class="mensaje-error">
            <strong>Falta conectar Google Sheets.</strong><br><br>
            Abre el código y coloca la URL CSV de tu hoja.
          </div>
        `;

        return;
      }


      const respuesta = await fetch(CSV_URL);

      if (!respuesta.ok) {
        throw new Error("No se pudo conectar con Google Sheets");
      }


      const texto = await respuesta.text();

      productos = convertirCSV(texto);


      if (!productos.length) {

        estado.innerHTML = `
          <div class="mensaje-error">
            No se encontraron productos en Google Sheets.
          </div>
        `;

        return;
      }


      crearFiltros();

      mostrarProductos(productos);

    }

    catch (error) {

      console.error(error);

      estado.innerHTML = `
        <div class="mensaje-error">
          <strong>No se pudieron cargar los productos.</strong><br><br>
          Revisa que Google Sheets esté publicado como CSV.
        </div>
      `;

    }

  }


  // ==========================================================
  // CONVERTIR CSV
  // ==========================================================

  function convertirCSV(texto) {

    const filas = [];
    let fila = [];
    let campo = "";
    let dentroComillas = false;


    for (let i = 0; i < texto.length; i++) {

      const caracter = texto[i];
      const siguiente = texto[i + 1];


      if (caracter === '"' && dentroComillas && siguiente === '"') {

        campo += '"';
        i++;

      }

      else if (caracter === '"') {

        dentroComillas = !dentroComillas;

      }

      else if (caracter === ',' && !dentroComillas) {

        fila.push(campo);
        campo = "";

      }

      else if (
        (caracter === '\n' || caracter === '\r')
        && !dentroComillas
      ) {

        if (caracter === '\r' && siguiente === '\n') {
          i++;
        }

        fila.push(campo);
        campo = "";

        if (fila.some(x => x.trim() !== "")) {
          filas.push(fila);
        }

        fila = [];

      }

      else {

        campo += caracter;

      }

    }


    if (campo !== "" || fila.length) {

      fila.push(campo);

      if (fila.some(x => x.trim() !== "")) {
        filas.push(fila);
      }

    }


    if (filas.length < 2) {
      return [];
    }


    const encabezados = filas[0].map(
      x => x.trim().toUpperCase()
    );


    return filas.slice(1).map(fila => {

      const producto = {};

      encabezados.forEach((encabezado, index) => {

        producto[encabezado] =
          (fila[index] || "").trim();

      });

      return producto;

    });

  }


  // ==========================================================
  // FILTROS
  // ==========================================================

  function crearFiltros() {

    const categoriaSelect =
      document.getElementById("categoria");

    const marcaSelect =
      document.getElementById("marca");


    const categorias = [
      ...new Set(
        productos
          .map(p => p.CATEGORIA)
          .filter(Boolean)
      )
    ].sort();


    const marcas = [
      ...new Set(
        productos
          .map(p => p.MARCA)
          .filter(Boolean)
      )
    ].sort();


    categorias.forEach(categoria => {

      const option =
        document.createElement("option");

      option.value = categoria;
      option.textContent = categoria;

      categoriaSelect.appendChild(option);

    });


    marcas.forEach(marca => {

      const option =
        document.createElement("option");

      option.value = marca;
      option.textContent = marca;

      marcaSelect.appendChild(option);

    });

  }


  // ==========================================================
  // MOSTRAR PRODUCTOS
  // ==========================================================

  function mostrarProductos(lista) {

    const contenedor =
      document.getElementById("productos");

    const estado =
      document.getElementById("estado");


    contenedor.innerHTML = "";


    if (!lista.length) {

      estado.innerHTML =
        "No encontramos productos con esa búsqueda.";

      return;

    }


    estado.innerHTML =
      `${lista.length} producto${lista.length === 1 ? "" : "s"}`;


    lista.forEach(producto => {

      const tarjeta =
        document.createElement("div");

      tarjeta.className = "producto";


      tarjeta.onclick = function() {

        abrirProducto(producto);

      };


      const imagen =
        producto.URL_IMAGEN_PRINCIPAL;


      let imagenHTML = "";


      if (imagen) {

        imagenHTML = `
          <img
            src="${imagen}"
            alt="${producto.NOMBRE_PRODUCTO || ""}"
            onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\\'sin-imagen\\'>Imagen no disponible</div>'"
          >
        `;

      }

      else {

        imagenHTML = `
          <div class="sin-imagen">
            Imagen próximamente
          </div>
        `;

      }


      let precioHTML = "";


      if (producto.PRECIO_OFERTA) {

        precioHTML = `
          <div class="oferta">
            $${formatearPrecio(producto.PRECIO_OFERTA)}
          </div>
        `;

      }

      else if (producto.PRECIO) {

        precioHTML = `
          <div class="precio">
            $${formatearPrecio(producto.PRECIO)}
          </div>
        `;

      }


      tarjeta.innerHTML = `

        <div class="producto-imagen">
          ${imagenHTML}
        </div>

        <div class="producto-info">

          <div class="marca">
            ${producto.MARCA || ""}
          </div>

          <h2>
            ${producto.NOMBRE_PRODUCTO || "Producto"}
          </h2>

          <div class="referencia">
            Ref: ${producto.REFERENCIA || "Por confirmar"}
          </div>

          ${precioHTML}

          <div class="boton">
            VER PRODUCTO
          </div>

        </div>

      `;


      contenedor.appendChild(tarjeta);

    });

  }


  // ==========================================================
  // ABRIR PRODUCTO
  // ==========================================================

  function abrirProducto(producto) {

    const id =
      producto.ID ||
      producto.REFERENCIA ||
      producto.NOMBRE_PRODUCTO;


    window.location.href =
      "producto.html?id=" +
      encodeURIComponent(id);

  }


  // ==========================================================
  // FORMATO PRECIO
  // ==========================================================

  function formatearPrecio(precio) {

    const numero =
      Number(
        String(precio)
          .replace(/\$/g, "")
          .replace(/\./g, "")
          .replace(/,/g, "")
          .trim()
      );


    if (isNaN(numero)) {
      return precio;
    }


    return numero.toLocaleString("es-CO");

  }


  // ==========================================================
  // BUSCADOR
  // ==========================================================

  function filtrarProductos() {

    const texto =
      document
        .getElementById("buscador")
        .value
        .toLowerCase()
        .trim();


    const categoria =
      document.getElementById("categoria").value;


    const marca =
      document.getElementById("marca").value;


    const filtrados =
      productos.filter(producto => {

        const contenido = [

          producto.NOMBRE_PRODUCTO,
          producto.MARCA,
          producto.REFERENCIA,
          producto.CATEGORIA,
          producto.SUBCATEGORIA

        ]
        .join(" ")
        .toLowerCase();


        const coincideTexto =
          !texto ||
          contenido.includes(texto);


        const coincideCategoria =
          !categoria ||
          producto.CATEGORIA === categoria;


        const coincideMarca =
          !marca ||
          producto.MARCA === marca;


        return (
          coincideTexto &&
          coincideCategoria &&
          coincideMarca
        );

      });


    mostrarProductos(filtrados);

  }


  document
    .getElementById("buscador")
    .addEventListener("input", filtrarProductos);


  document
    .getElementById("categoria")
    .addEventListener("change", filtrarProductos);


  document
    .getElementById("marca")
    .addEventListener("change", filtrarProductos);


  // ==========================================================
  // INICIAR
  // ==========================================================

  cargarProductos();

</script>

</body>
</html>
