<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Catálogo - Variedades Juancho La Octava</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #ffffff;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      max-width: 180px;
      max-height: 90px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    header p {
      color: #666;
      font-size: 14px;
    }

    .contenedor {
      max-width: 1200px;
      margin: auto;
      padding: 25px 15px;
    }

    .buscador {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 25px;
      outline: none;
    }

    .buscador:focus {
      border-color: #333;
    }

    #estado {
      text-align: center;
      padding: 20px;
      font-size: 16px;
      color: #666;
    }

    .catalogo {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .producto {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .producto:hover {
      transform: translateY(-4px);
      box-shadow: 0 7px 20px rgba(0,0,0,0.15);
    }

    .imagen-contenedor {
      width: 100%;
      height: 230px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .imagen-producto {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .sin-imagen {
      color: #999;
      font-size: 14px;
      text-align: center;
    }

    .informacion {
      padding: 15px;
    }

    .marca {
      font-size: 12px;
      color: #777;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .nombre {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .referencia {
      font-size: 13px;
      color: #777;
      margin-bottom: 10px;
    }

    .precio {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .boton {
      display: block;
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 7px;
      background: #222;
      color: white;
      text-align: center;
      font-size: 14px;
      cursor: pointer;
    }

    .boton:hover {
      background: #444;
    }

    .error {
      background: #fff0f0;
      color: #b00020;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      line-height: 1.5;
    }

    .sin-resultados {
      text-align: center;
      grid-column: 1 / -1;
      padding: 40px;
      color: #777;
    }

    footer {
      margin-top: 40px;
      background: #222;
      color: white;
      text-align: center;
      padding: 25px 15px;
      font-size: 14px;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 21px;
      }

      .catalogo {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .imagen-contenedor {
        height: 170px;
      }

      .informacion {
        padding: 10px;
      }

      .nombre {
        font-size: 14px;
      }

      .precio {
        font-size: 17px;
      }

      .boton {
        font-size: 12px;
        padding: 9px;
      }
    }
  </style>
</head>

<body>

  <header>

    <!--
      SI TU LOGO SE LLAMA DIFERENTE:
      cambia "logo.png" por el nombre exacto de tu archivo.
    -->
    <img
      src="logo.png"
      alt="Variedades Juancho La Octava"
      class="logo"
      onerror="this.style.display='none';"
    >

    <h1>Variedades Juancho La Octava</h1>
    <p>Catálogo de productos</p>

  </header>


  <main class="contenedor">

    <input
      type="text"
      id="buscador"
      class="buscador"
      placeholder="Buscar producto, marca o referencia..."
    >

    <div id="estado">
      Cargando productos...
    </div>

    <section id="catalogo" class="catalogo"></section>

  </main>


  <footer>
    Variedades Juancho La Octava
  </footer>


  <script>

    /*
    ============================================================
    CONFIGURACIÓN
    ============================================================
    */

    const CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vScjVb-MSKc0GOTMvpaXGqaYoqmWKb2YejFsWUauA4dRNZuBQzOH4y8thksz6KVw405F2au7pYKCHP_/pub?output=csv";


    /*
      COLOCA AQUÍ TU NÚMERO DE WHATSAPP.

      Ejemplo Colombia:
      573001234567

      SIN +
      SIN ESPACIOS
    */

    const WHATSAPP_NUMBER = "573219755256";


    let productos = [];


    /*
    ============================================================
    NORMALIZAR NOMBRES DE COLUMNAS
    ============================================================
    */

    function normalizar(texto) {

      return String(texto || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");

    }


    /*
    ============================================================
    BUSCAR VALOR DE UNA COLUMNA
    ============================================================
    */

    function obtenerValor(producto, posiblesNombres) {

      const columnas = Object.keys(producto);

      for (const nombre of posiblesNombres) {

        const buscado = normalizar(nombre);

        const columna = columnas.find(
          c => normalizar(c) === buscado
        );

        if (columna) {

          const valor = producto[columna];

          if (
            valor !== undefined &&
            valor !== null &&
            String(valor).trim() !== ""
          ) {

            return String(valor).trim();

          }

        }

      }

      return "";

    }


    /*
    ============================================================
    PARSER CSV
    ============================================================
    */

    function convertirCSV(texto) {

      const filas = [];

      let fila = [];
      let campo = "";
      let dentroComillas = false;

      for (let i = 0; i < texto.length; i++) {

        const caracter = texto[i];
        const siguiente = texto[i + 1];

        if (caracter === '"' && dentroComillas && siguiente === '"') {

          campo += '"';
          i++;
          continue;

        }

        if (caracter === '"') {

          dentroComillas = !dentroComillas;
          continue;

        }

        if (caracter === "," && !dentroComillas) {

          fila.push(campo);
          campo = "";
          continue;

        }

        if (
          (caracter === "\n" || caracter === "\r") &&
          !dentroComillas
        ) {

          if (caracter === "\r" && siguiente === "\n") {
            i++;
          }

          fila.push(campo);
          campo = "";

          if (fila.some(x => String(x).trim() !== "")) {
            filas.push(fila);
          }

          fila = [];

          continue;

        }

        campo += caracter;

      }


      if (campo !== "" || fila.length > 0) {

        fila.push(campo);

        if (fila.some(x => String(x).trim() !== "")) {
          filas.push(fila);
        }

      }


      if (filas.length < 2) {
        return [];
      }


      const encabezados = filas[0].map(
        x => String(x).trim()
      );


      return filas.slice(1).map(fila => {

        const objeto = {};

        encabezados.forEach((encabezado, indice) => {

          objeto[encabezado] =
            fila[indice] !== undefined
              ? fila[indice].trim()
              : "";

        });

        return objeto;

      });

    }


    /*
    ============================================================
    FORMATO DE PRECIO
    ============================================================
    */

    function formatoPrecio(precio) {

      if (!precio) {
        return "";
      }

      const numero = String(precio)
        .replace(/\$/g, "")
        .replace(/\./g, "")
        .replace(/,/g, "")
        .replace(/[^\d]/g, "");

      if (!numero) {
        return precio;
      }

      return "$" + Number(numero).toLocaleString("es-CO");

    }


    /*
    ============================================================
    OBTENER ID DEL PRODUCTO
    ============================================================
    */

    function obtenerID(producto, indice) {

      return obtenerValor(producto, [
        "id",
        "codigo",
        "cod",
        "sku",
        "referencia",
        "ref",
        "modelo"
      ]) || String(indice);

    }


    /*
    ============================================================
    CREAR TARJETA
    ============================================================
    */

    function crearTarjeta(producto, indice) {

      const nombre = obtenerValor(producto, [
        "producto",
        "nombre",
        "name",
        "descripcion corta",
        "titulo",
        "articulo"
      ]) || "Producto";


      const marca = obtenerValor(producto, [
        "marca",
        "brand"
      ]);


      const referencia = obtenerValor(producto, [
        "referencia",
        "ref",
        "modelo",
        "sku",
        "codigo"
      ]);


      const precio = obtenerValor(producto, [
        "precio",
        "price",
        "valor",
        "precio venta"
      ]);


      const imagen = obtenerValor(producto, [
        "imagen",
        "image",
        "foto",
        "url imagen",
        "urlimagen",
        "imagen url",
        "image url"
      ]);


      const id = obtenerID(producto, indice);


      const tarjeta = document.createElement("article");

      tarjeta.className = "producto";


      tarjeta.addEventListener("click", function() {

        window.location.href =
          "producto.html?id=" +
          encodeURIComponent(id);

      });


      let imagenHTML = "";

      if (imagen) {

        imagenHTML = `
          <img
            src="${imagen}"
            alt="${nombre}"
            class="imagen-producto"
            loading="lazy"
            onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=&quot;sin-imagen&quot;>Imagen no disponible</div>';"
          >
        `;

      } else {

        imagenHTML = `
          <div class="sin-imagen">
            Imagen no disponible
          </div>
        `;

      }


      tarjeta.innerHTML = `

        <div class="imagen-contenedor">
          ${imagenHTML}
        </div>

        <div class="informacion">

          ${marca
            ? `<div class="marca">${marca}</div>`
            : ""
          }

          <div class="nombre">
            ${nombre}
          </div>

          ${referencia
            ? `<div class="referencia">
                Ref: ${referencia}
              </div>`
            : ""
          }

          ${precio
            ? `<div class="precio">
                ${formatoPrecio(precio)}
              </div>`
            : ""
          }

          <div class="boton">
            Ver producto
          </div>

        </div>

      `;


      return tarjeta;

    }


    /*
    ============================================================
    MOSTRAR PRODUCTOS
    ============================================================
    */

    function mostrarProductos(lista) {

      const catalogo =
        document.getElementById("catalogo");

      catalogo.innerHTML = "";


      if (!lista.length) {

        catalogo.innerHTML = `
          <div class="sin-resultados">
            No se encontraron productos.
          </div>
        `;

        return;

      }


      lista.forEach((producto, indice) => {

        catalogo.appendChild(
          crearTarjeta(producto, indice)
        );

      });

    }


    /*
    ============================================================
    BUSCADOR
    ============================================================
    */

    document
      .getElementById("buscador")
      .addEventListener("input", function() {

        const busqueda =
          normalizar(this.value);


        if (!busqueda) {

          mostrarProductos(productos);
          return;

        }


        const filtrados =
          productos.filter(producto => {

            return Object.values(producto)
              .join(" ")
              .toLowerCase()
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .includes(busqueda);

          });


        mostrarProductos(filtrados);

      });


    /*
    ============================================================
    CARGAR GOOGLE SHEETS
    ============================================================
    */

    async function cargarProductos() {

      const estado =
        document.getElementById("estado");


      try {

        const respuesta =
          await fetch(
            CSV_URL + "&t=" + Date.now()
          );


        if (!respuesta.ok) {

          throw new Error(
            "No se pudo acceder a Google Sheets."
          );

        }


        const texto =
          await respuesta.text();


        productos =
          convertirCSV(texto);


        if (!productos.length) {

          throw new Error(
            "La hoja está vacía o el CSV no tiene un formato válido."
          );

        }


        estado.style.display = "none";


        mostrarProductos(productos);


      } catch (error) {

        console.error(error);


        estado.innerHTML = `

          <div class="error">

            <strong>
              No se pudieron cargar los productos.
            </strong>

            <br><br>

            Revisa que la hoja de Google Sheets
            esté publicada en la web como CSV.

            <br><br>

            Error:
            ${error.message}

          </div>

        `;

      }

    }


    /*
    ============================================================
    INICIAR
    ============================================================
    */

    cargarProductos();

  </script>

</body>
</html>
